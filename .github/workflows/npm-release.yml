name: npm release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "true only after verifying the exact SHA from phase 1"
        type: choice
        options: ["false", "true"]
        default: "false"
      github_release:
        description: "true to publish GitHub Release with verified archive"
        type: choice
        options: ["false", "true"]
        default: "false"
      expected_sha:
        description: "SHA-256 of the archive from phase 1 (required when github_release=true or publish=true)"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: npm-release-dsh-incidental-learn-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'oxmumu3/dsh-incidental-learn' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.21.0"
      - name: Pin npm for trusted publishing
        run: |
          set -eu
          npm install -g npm@11.15.0 --ignore-scripts --no-audit --no-fund
          node --version
          npm --version
      - name: Build, check client bundle, and run unit tests
        run: npm run build && npm run check:client && npm test
      - name: Pack verified deterministic tarball
        id: pack
        run: |
          set -eu
          node scripts/build-package.mjs --out dist
          cd dist
          sha256sum ./*.tgz > SHA256SUMS
          cat SHA256SUMS
          echo "sha256=$(awk '{print $1}' SHA256SUMS)" >> "$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: incidental-learn-archive
          path: dist/
          if-no-files-found: error
          retention-days: 7

  github_release:
    needs: verify
    if: >-
      (inputs.github_release == 'true' || inputs.publish == 'true') &&
      github.repository == 'oxmumu3/dsh-incidental-learn' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          merge-multiple: true
          path: dist
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.21.0"
      - name: Verify exact SHA-256 and package identity
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          VERIFIED_SHA: ${{ needs.verify.outputs.sha256 }}
        run: |
          set -eu
          test -n "${EXPECTED_SHA}"
          echo "${EXPECTED_SHA}" | grep -Eq '^[0-9a-f]{64}$'
          actual="$(sha256sum ./dist/*.tgz | awk '{print $1}')"
          test "${EXPECTED_SHA}" = "${actual}"
          test "${VERIFIED_SHA}" = "${actual}"
          tar -xzf ./dist/*.tgz -C dist package/package.json
          node - <<'NODE'
          const fs = require('node:fs')
          const manifest = JSON.parse(fs.readFileSync('dist/package/package.json', 'utf8'))
          if (manifest.name !== '@oxmumu3/dsh-incidental-learn') throw new Error(`unexpected name: ${manifest.name}`)
          if (manifest.private !== false) throw new Error('manifest is still private')
          console.log(JSON.stringify({ ok: true, name: manifest.name, version: manifest.version }))
          NODE
          rm -rf dist/package
      - name: Create or verify GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          tar -xzf ./dist/*.tgz -C dist package/package.json
          VERSION="$(node -p "require('./dist/package/package.json').version")"
          rm -rf dist/package
          TAG="v${VERSION}"
          actual="$(sha256sum ./dist/*.tgz | awk '{print $1}')"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            remote="$(gh release view "${TAG}" --json assets --jq '.assets[] | select(.name | endswith(".tgz")) | .digest')"
            test "$remote" = "sha256:${actual}"
          else
            gh release create "${TAG}" ./dist/*.tgz ./dist/SHA256SUMS --title "dsh-incidental-learn v${VERSION}" --notes "Verified release archive of @oxmumu3/dsh-incidental-learn v${VERSION} (SHA-256: ${actual})."
          fi

  publish:
    needs: verify
    if: >-
      inputs.publish == 'true' &&
      github.repository == 'oxmumu3/dsh-incidental-learn' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          merge-multiple: true
          path: dist
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.21.0"
          registry-url: "https://registry.npmjs.org"
      - name: Pin npm for trusted publishing
        run: |
          set -eu
          npm install -g npm@11.15.0 --ignore-scripts --no-audit --no-fund
          node --version
          npm --version
      - name: Verify exact SHA-256 and package identity
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          VERIFIED_SHA: ${{ needs.verify.outputs.sha256 }}
        run: |
          set -eu
          test -n "${EXPECTED_SHA}"
          echo "${EXPECTED_SHA}" | grep -Eq '^[0-9a-f]{64}$'
          actual="$(sha256sum ./dist/*.tgz | awk '{print $1}')"
          test "${EXPECTED_SHA}" = "${actual}"
          test "${VERIFIED_SHA}" = "${actual}"
          tar -xzf ./dist/*.tgz -C dist package/package.json
          node - <<'NODE'
          const fs = require('node:fs')
          const manifest = JSON.parse(fs.readFileSync('dist/package/package.json', 'utf8'))
          if (manifest.name !== '@oxmumu3/dsh-incidental-learn') throw new Error(`unexpected name: ${manifest.name}`)
          if (manifest.private !== false) throw new Error('manifest is still private')
          console.log(JSON.stringify({ ok: true, name: manifest.name, version: manifest.version }))
          NODE
          rm -rf dist/package
      - name: Publish exact artifact to npm via Trusted Publisher
        run: npm publish ./dist/*.tgz --ignore-scripts --provenance --access public
